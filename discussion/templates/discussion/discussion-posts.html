{% extends 'base.html' %} {% block content %}
<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    padding: 0;
    margin: 0;
  }

  body {
    font-family: "Roboto", sans-serif;
    font-size: 1.2rem;
    line-height: 1.6;
    background-color: #f8fafd;
  }

  .container {
    margin: 2em auto;
    max-width: 900px;
    padding: 0 1rem;
  }

  .question-card {
    display: flex;
    flex-direction: column;
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.04);
    padding: 2rem;
    border-radius: 12px;
    margin-bottom: 2em;
    gap: 1rem;
    transition: box-shadow 0.2s ease-in-out;
  }

  .question-card:hover {
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
  }

  .author_name {
    font-size: 0.95rem;
    color: #6b7280;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 0.8rem;
  }

  .author_name a {
    color: #2563eb;
    font-weight: 500;
  }

  .question-title h2 {
    font-size: 1.6rem;
    color: #111827;
    margin-bottom: 0.5rem;
  }

  .question-detail {
    font-size: 1rem;
    color: #374151;
  }

  .tag-section {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin: 1rem 0;
  }

  .tags {
    padding: 0.4em 1em;
    border: 1px solid #2563eb;
    border-radius: 9999px;
    background-color: #e0f2fe;
    color: #2563eb;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
  }

  .read-more {
    width: 100%;
  }

  .read-more__button {
    width: 100%;
    padding: 0.75rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    color: #ffffff;
    background-color: #2563eb;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  .read-more__button:hover {
    background-color: #1e40af;
  }

  .read-more__link {
    text-decoration: none;
  }

  @media (max-width: 630px) {
    .container {
      padding: 0 1em;
    }

    .question-card {
      padding: 1.5rem;
    }
  }
</style>

<div class="container">
  {% for post in posts %}
  <section class="question-card">
    <span class="author_name">
      By <a href="{% url 'user-profile' post.owner.id %}">{{ post.owner }}</a>
    </span>

    <article class="question-section">
      <span class="question-title"><h2>{{ post.title }}</h2></span>
      <span class="question-detail">{{ post.discription }}</span>
    </article>

    <section class="tag-section">
      {% for tag in post.tags.all %}
      <span class="tags">{{ tag.name }}</span>
      {% endfor %}
    </section>

    <a href="{% url 'single-discussion' post.id %}" class="read-more__link">
      <button class="read-more__button">Read More</button>
    </a>
  </section>
  {% endfor %}
</div>

{% endblock content %}
